[project]
name = "bidcheck"
version = "0.1.0"
description = "Converts a bid-storm recording to Parquet and checks it"
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.1"]

[project.scripts]
bidcheck = "bidcheck.__main__:main"
bidsite = "bidcheck.site:main"
bidcost = "bidcheck.cost:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
